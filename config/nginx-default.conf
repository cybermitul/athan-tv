# nginx config for the athan-tv page. "no-cache" makes Chromium re-check every file,
# so updated pages appear immediately after an update.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}

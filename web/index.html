<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Prayer Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans+Bengali:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#e9c46a; --accent:#5fd4a8; --text:#f4f1ea; --muted:rgba(244,241,234,.66);
    --glass:rgba(8,15,24,.58); --glass-border:rgba(255,255,255,.12);
    --ui:'Inter','Segoe UI',system-ui,sans-serif;
    --ar:'Amiri Quran','Amiri','Noto Naskh Arabic','Noto Sans Arabic',serif;
    --ur:'Noto Nastaliq Urdu','Noto Naskh Arabic','Noto Sans Arabic',serif;
    --bn:'Noto Sans Bengali','Noto Serif Bengali',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a1420;color:var(--text);font-family:var(--ui);cursor:none}

  /* ---------- background ---------- */
  .fallback{position:fixed;inset:0;background:radial-gradient(ellipse at 70% 20%,#1d3b5a 0%,#0a1420 65%)}
  .bg{position:fixed;inset:-2%;background-size:cover;background-position:center;opacity:0;transition:opacity 3s ease}
  .bg.show{opacity:1}
  .bg.kb{animation:kb 90s ease-in-out infinite alternate}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
  .shade{position:fixed;inset:0;background:
    linear-gradient(90deg,rgba(4,9,16,.80) 0%,rgba(4,9,16,.42) 42%,rgba(4,9,16,.60) 100%),
    linear-gradient(180deg,rgba(4,9,16,.55) 0%,rgba(4,9,16,.10) 28%,rgba(4,9,16,.65) 100%)}

  /* ---------- layout ---------- */
  .wrap{position:relative;z-index:2;height:100vh;display:grid;grid-template-rows:auto 1fr auto auto;padding:2.6vh 2.8vw 1.4vh;gap:1.6vh}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:2vw}
  .clock{font-size:7vw;font-weight:700;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 .3vw 1.5vw rgba(0,0,0,.55)}
  .clock .sec{font-size:.38em;color:var(--muted);font-weight:500;margin-left:.3vw}
  .clock .ampm{font-size:.3em;color:var(--muted);font-weight:600;margin-left:.5vw;letter-spacing:.05em}
  .dates{justify-self:end;text-align:right;text-shadow:0 .2vw 1vw rgba(0,0,0,.65)}
  .hijri-ar{font-family:var(--ar);font-size:2.3vw;color:var(--gold);line-height:1.5;direction:rtl}
  .hijri{font-size:1.45vw;color:var(--gold);font-weight:600}
  .greg{font-size:1.25vw;color:var(--muted);margin-top:.4vh}

  main{display:grid;grid-template-columns:31vw 1fr;gap:1.8vw;min-height:0}
  .glass{background:var(--glass);border:1px solid var(--glass-border);border-radius:1.1vw;box-shadow:0 1vw 3vw rgba(0,0,0,.25)}

  /* ---------- prayers column ---------- */
  .left{display:flex;flex-direction:column;gap:1.8vh;min-height:0}
  .next{padding:2vh 1.6vw;border-left:.35vw solid var(--accent)}
  .next .label{font-size:.95vw;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .next .name{font-size:2.5vw;font-weight:700;margin-top:.5vh;display:flex;align-items:baseline;gap:.8vw;flex-wrap:wrap}
  .next .name .ar{font-family:var(--ar);font-weight:400;color:var(--gold);font-size:.95em}
  .next .cd{font-size:3.2vw;font-weight:600;font-variant-numeric:tabular-nums;margin-top:.3vh}
  .next.soon .cd{color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.5}}

  .plist{flex:1;display:flex;flex-direction:column;padding:.8vh .5vw;min-height:0}
  .prow{flex:1;display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 1.2vw;border-radius:.8vw;border:2px solid transparent;transition:background .6s,border-color .6s}
  .prow + .prow{border-top-color:transparent;box-shadow:0 -1px 0 rgba(255,255,255,.07)}
  .pname{font-size:1.75vw;font-weight:600;line-height:1.15}
  .pname .ar{display:block;font-family:var(--ar);font-weight:400;font-size:1.3vw;color:var(--muted);line-height:1.3}
  .ptime{font-size:2.4vw;font-weight:700;font-variant-numeric:tabular-nums}
  .ptime small{font-size:.48em;color:var(--muted);margin-left:.3vw;font-weight:600}
  .prow.sunrise{opacity:.62}
  .prow.sunrise .pname,.prow.sunrise .ptime{font-weight:500}
  .prow.active{background:rgba(95,212,168,.16);border-color:var(--accent);box-shadow:none}
  .prow.active .pname{color:var(--accent)}

  /* ---------- ayah / hadith cards ---------- */
  .right{position:relative;min-height:0}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity 1.2s ease,visibility 1.2s}
  .slide.on{opacity:1;visibility:visible}
  .slide > .card{height:100%}
  .dots{position:absolute;right:1.2vw;bottom:-1.2vh;display:flex;gap:.4vw;z-index:3}
  .dots i{width:.5vw;height:.5vw;border-radius:50%;background:rgba(255,255,255,.3);transition:background .6s}
  .dots i.on{background:var(--gold)}

  /* ---------- family: week ---------- */
  .famupd{font-size:.8vw;color:var(--muted)}
  .week{flex:1;display:flex;flex-direction:column;gap:.5vh;min-height:0}
  .wday{flex:1;display:grid;grid-template-columns:10.5vw 1fr;align-items:center;padding:0 1vw;border-radius:.6vw;border:1px solid transparent;min-height:0;overflow:hidden}
  .wday + .wday{box-shadow:0 -1px 0 rgba(255,255,255,.06)}
  .wday.today{background:rgba(95,212,168,.14);border-color:var(--accent);box-shadow:none}
  .wlabel{font-size:1.45vw;font-weight:700;line-height:1.15}
  .wday.today .wlabel{color:var(--accent)}
  .wlabel small{display:block;font-size:.66em;color:var(--muted);font-weight:500}
  .wevs{display:flex;flex-wrap:wrap;align-items:center;gap:.4vh 1.4vw;overflow:hidden;max-height:100%}
  .ev{font-size:1.35vw;white-space:nowrap}
  .ev .t{color:var(--gold);font-weight:600;margin-right:.45vw;font-variant-numeric:tabular-nums}
  .ev.allday{background:rgba(233,196,106,.2);padding:.2vh .7vw;border-radius:.4vw}
  .none{font-size:1.1vw;color:rgba(244,241,234,.35)}
  .more{font-size:1vw;color:var(--muted)}

  /* ---------- family: lists ---------- */
  .lists{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2vw;min-height:0;padding-top:.5vh}
  .lcol{display:flex;flex-direction:column;min-height:0}
  .lname{display:flex;justify-content:space-between;align-items:baseline;font-size:1.7vw;font-weight:700;padding-bottom:.8vh;margin-bottom:1vh;border-bottom:2px solid rgba(233,196,106,.45)}
  .lname .n{font-size:.62em;color:var(--muted);font-weight:500}
  .litems{display:flex;flex-direction:column;gap:.9vh;overflow:hidden}
  .li{display:flex;align-items:center;gap:.9vw;font-size:1.5vw;line-height:1.25}
  .box{flex:none;width:1.3vw;height:1.3vw;border:.16vw solid rgba(244,241,234,.55);border-radius:.3vw}
  .li.high .box{border-color:#f4b942}
  .li .due{margin-left:auto;padding-left:1vw;font-size:.72em;color:var(--muted);white-space:nowrap}
  .li .due.over{color:#f08080}
  .alldone{font-size:1.3vw;color:var(--accent)}
  .card{display:flex;flex-direction:column;padding:2.2vh 2vw;min-height:0;--fs:1;--afs:1}
  .card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:1vh}
  .card-title{font-size:1.1vw;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .langs{display:flex;gap:.45vw}
  .langs span{font-size:1vw;padding:.25vh .7vw;border-radius:1vw;border:1px solid rgba(255,255,255,.22);color:var(--muted);transition:all .6s}
  .langs span.on{background:var(--gold);color:#1b1b1b;border-color:var(--gold);font-weight:600}
  .card-body{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .inner{width:100%;display:flex;flex-direction:column;gap:1.8vh}
  .arabic{font-family:var(--ar);direction:rtl;text-align:center;font-size:calc(4.2vw * var(--fs) * var(--afs,1));line-height:1.6;color:#fff;text-shadow:0 .15vw .8vw rgba(0,0,0,.5)}
  .trans{text-align:center;font-size:calc(3.2vw * var(--fs));line-height:1.4;transition:opacity .8s ease}
  .trans.fade{opacity:0}
  .trans.ur{font-family:var(--ur);direction:rtl;font-size:calc(2.2vw * var(--fs));line-height:2.3}
  .trans.bn{font-family:var(--bn);font-size:calc(2.3vw * var(--fs));line-height:1.6}
  .ref{text-align:center;font-size:1.5vw;color:var(--gold);margin-top:.8vh;opacity:.9}
  .ref .ar{font-family:var(--ar);font-size:1.25em}

  /* ---------- 7-day forecast slide ---------- */
  .fc{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.8vw;min-height:0;padding-top:1vh}
  .fday{display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:2vh .5vw;border-radius:1vw;background:rgba(255,255,255,.05);border:1px solid transparent;min-height:0;text-align:center}
  .fday.today{background:rgba(95,212,168,.14);border-color:var(--accent)}
  .fday.wet{background:rgba(110,170,255,.13)}
  .fday.today.wet{background:rgba(95,212,168,.14)}
  .fdow{font-size:2vw;font-weight:700;line-height:1.1}
  .fday.today .fdow{color:var(--accent)}
  .fmd{font-size:1.15vw;color:var(--muted)}
  .ficon{font-family:'Noto Color Emoji',sans-serif;font-size:5vw;line-height:1}
  .ftext{font-size:1.1vw;color:var(--muted);line-height:1.25;min-height:2.6em;display:flex;align-items:center}
  .ftemp{font-size:2.6vw;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .ftemp small{display:block;font-size:.62em;color:var(--muted);font-weight:500;margin-top:.6vh}
  .fbar{position:relative;width:70%;height:.6vh;border-radius:.3vh;background:rgba(255,255,255,.1)}
  .fbar i{position:absolute;top:0;bottom:0;border-radius:.3vh;background:linear-gradient(90deg,#7cc4ff,#f4b942)}
  .frain{font-size:1.15vw;color:var(--muted);line-height:1.3}
  .fday.wet .frain{color:#9fd0ff;font-weight:600}
  .fwind{font-size:1.05vw;color:var(--muted)}
  .fnote{font-size:.85vw;color:var(--muted);text-align:right}

  /* ---------- live news video slide ---------- */
  .vcard{padding:1.6vh 1.4vw}
  .vbox{position:relative;flex:1;min-height:0;border-radius:.8vw;overflow:hidden;background:#000}
  .vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.4vw;color:var(--muted);text-align:center;padding:2vw}
  .live{display:flex;align-items:center;gap:.6vw;font-size:1.05vw;font-weight:700;letter-spacing:.12em;color:#fff}
  .live i{width:.7vw;height:.7vw;border-radius:50%;background:#e5484d;animation:pulse 1.4s ease-in-out infinite}
  .live span{font-weight:500;letter-spacing:0;color:var(--muted)}

  /* ---------- markets slide ---------- */
  .mk{flex:1;display:grid;grid-template-columns:repeat(var(--mkcols,4),minmax(0,1fr));grid-auto-rows:1fr;gap:1vw;min-height:0;padding-top:.6vh}
  .mt{display:flex;flex-direction:column;justify-content:space-between;padding:1.6vh 1.1vw;border-radius:.9vw;background:rgba(255,255,255,.05);min-height:0;border-top:.35vh solid transparent}
  .mt.up{border-top-color:#3ecf8e}
  .mt.down{border-top-color:#f16a6a}
  .mlabel{font-size:1.25vw;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mprice{font-size:2.4vw;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
  .mchg{font-size:1.3vw;font-weight:600;font-variant-numeric:tabular-nums}
  .mt.up .mchg{color:#3ecf8e}
  .mt.down .mchg{color:#f16a6a}
  .mt svg{width:100%;height:6.5vh;display:block}
  .mstale{font-size:.85vw;color:#f4b942}
  .mstate{font-size:1vw;font-weight:700;letter-spacing:.1em;padding:.3vh .8vw;border-radius:1vw}
  .mstate.open{background:rgba(62,207,142,.2);color:#3ecf8e}
  .mstate.closed{background:rgba(255,255,255,.1);color:var(--muted)}

  /* ---------- weather (header, centre) ---------- */
  .weather{display:flex;align-items:center;gap:1vw;padding:1vh 1.4vw;text-shadow:0 .2vw 1vw rgba(0,0,0,.6)}
  .weather.hidden{visibility:hidden}
  .wicon{font-size:4vw;line-height:1;font-family:'Noto Color Emoji',sans-serif}
  .wtemp{font-size:4.4vw;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .wtemp small{font-size:.4em;color:var(--muted);font-weight:500;vertical-align:super}
  .wdetail{font-size:1.05vw;line-height:1.55;color:var(--muted)}
  .wdetail .wtext{font-size:1.35vw;color:var(--text);font-weight:600}
  .wdetail b{color:var(--text);font-weight:600}

  /* ---------- bottom stack: alerts + tickers ---------- */
  .bottom{display:flex;flex-direction:column;gap:.9vh}
  .alertbar{display:flex;align-items:center;gap:1vw;min-height:5.2vh;padding:.6vh 1.3vw;border-radius:.9vw;font-size:1.45vw;font-weight:600;color:#1b1b1b;background:#9ad8f0}
  .alertbar.hidden{display:none}
  .alertbar.moderate{background:#f4b942}
  .alertbar.severe{background:#e5484d;color:#fff;animation:alertglow 2s ease-in-out infinite}
  @keyframes alertglow{50%{box-shadow:0 0 2.5vw rgba(229,72,77,.7)}}
  .alertbar .aicon{font-family:'Noto Color Emoji',sans-serif;font-size:1.3em}
  .alertbar .atext{flex:1;transition:opacity .6s}
  .alertbar .acount{font-size:.75em;opacity:.8}

  /* ---------- news tickers ---------- */
  .ticker{display:flex;align-items:stretch;height:5.4vh;background:rgba(8,15,24,.74);border:1px solid var(--glass-border);border-radius:.9vw;overflow:hidden}
  .ticker.hidden{display:none}
  .tlabel{flex:none;width:11vw;display:flex;align-items:center;gap:.6vw;padding:0 1.1vw;background:#b3261e;color:#fff;font-family:var(--bn);font-weight:500;font-size:1.3vw;white-space:nowrap}
  /* wide enough for a two-word label like US MARKETS on one line */
  .ticker.us .tlabel{width:12.6vw;background:#1f4e9c;font-family:var(--ui);font-weight:700;letter-spacing:.06em;font-size:1.05vw}
  .ticker.us .nitem{font-family:var(--ui);font-size:1.45vw}
  .tlabel .dot{width:.55vw;height:.55vw;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
  .tview{flex:1;position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 2.5%,#000 97.5%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 2.5%,#000 97.5%,transparent 100%)}
  .ttrack{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;will-change:transform;animation:tscroll 60s linear infinite}
  @keyframes tscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .nitem{font-family:var(--bn);font-size:1.6vw;padding:0 1.2vw;line-height:1}
  .nsrc{font-size:.62em;color:var(--gold);margin-left:.8vw;opacity:.9}
  .nsep{color:var(--accent);font-size:.8vw}

  footer{display:flex;justify-content:space-between;font-size:.8vw;color:var(--muted)}
  #status{color:#f0a7a7}
</style>
</head>
<body>
<div class="fallback"></div>
<div class="bg kb" id="bgA"></div>
<div class="bg kb" id="bgB"></div>
<div class="shade"></div>

<div class="wrap">
  <header>
    <div class="clock" id="clock">--:--</div>
    <div class="weather glass hidden" id="weather">
      <div class="wicon" id="wIcon"></div>
      <div class="wtemp" id="wTemp"></div>
      <div class="wdetail" id="wDetail"></div>
    </div>
    <div class="dates">
      <div class="hijri-ar" id="hijriAr" lang="ar">&nbsp;</div>
      <div class="hijri" id="hijri">&nbsp;</div>
      <div class="greg" id="greg">&nbsp;</div>
    </div>
  </header>

  <main>
    <section class="left">
      <div class="next glass" id="next">
        <div class="label">Next Prayer</div>
        <div class="name" id="nextName">—</div>
        <div class="cd" id="nextCd">&nbsp;</div>
      </div>
      <div class="plist glass" id="plist"></div>
    </section>

    <section class="right">
      <div class="slide on" id="slideAyah">
        <div class="card glass" id="ayahCard">
          <div class="card-h"><div class="card-title">Ayah of the Hour</div><div class="langs"></div></div>
          <div class="card-body"><div class="inner">
            <div class="arabic" lang="ar"></div>
            <div class="trans"></div>
          </div></div>
          <div class="ref"></div>
        </div>
      </div>
      <div class="slide" id="slideHadith">
        <div class="card glass" id="hadithCard">
          <div class="card-h"><div class="card-title">Hadith of the Hour</div><div class="langs"></div></div>
          <div class="card-body"><div class="inner">
            <div class="arabic" lang="ar"></div>
            <div class="trans"></div>
          </div></div>
          <div class="ref"></div>
        </div>
      </div>
      <div class="slide" id="slideForecast">
        <div class="card glass">
          <div class="card-h"><div class="card-title">7-Day Forecast</div><div class="fnote" id="fcUpd"></div></div>
          <div class="fc" id="fc"></div>
        </div>
      </div>
      <div class="slide" id="slideNewsVideo">
        <div class="card glass vcard">
          <div class="card-h"><div class="card-title" id="vTitle">US News Live</div><div class="live"><i></i>LIVE <span id="vName"></span></div></div>
          <div class="vbox" id="vbox"><div class="vmsg" id="vmsg">Connecting to live news…</div></div>
        </div>
      </div>
      <div class="slide" id="slideMarkets">
        <div class="card glass">
          <div class="card-h"><div class="card-title">Markets</div><div style="display:flex;gap:1vw;align-items:center"><span class="fnote" id="mkUpd"></span><span class="mstate" id="mkState"></span></div></div>
          <div class="mk" id="mk"></div>
        </div>
      </div>
      <div class="slide" id="slideWeek">
        <div class="card glass">
          <div class="card-h"><div class="card-title">This Week</div><div class="famupd" id="weekUpd"></div></div>
          <div class="week" id="week"></div>
        </div>
      </div>
      <div class="slide" id="slideLists">
        <div class="card glass">
          <div class="card-h"><div class="card-title">Lists</div><div class="famupd" id="listsUpd"></div></div>
          <div class="lists" id="lists"></div>
        </div>
      </div>
      <div class="dots" id="dots"></div>
    </section>
  </main>

  <div class="bottom">
    <div class="alertbar hidden" id="alertbar">
      <span class="aicon" id="aIcon"></span><span class="atext" id="aText"></span><span class="acount" id="aCount"></span>
    </div>
    <div class="ticker us hidden" id="tickerUS">
      <div class="tlabel"><span class="dot"></span>US MARKETS</div>
      <div class="tview"><div class="ttrack" id="ttrackUS"></div></div>
    </div>
    <div class="ticker hidden" id="tickerBN">
      <div class="tlabel"><span class="dot"></span>সর্বশেষ সংবাদ</div>
      <div class="tview"><div class="ttrack" id="ttrackBN"></div></div>
    </div>
  </div>

  <footer>
    <div id="methodInfo">&nbsp;</div>
    <div id="status"></div>
  </footer>
</div>

<script src="config.js"></script>
<script>
/* ============================ CONFIG ============================
   Defaults only. On an installed box, config.js (generated from
   /etc/default/athan by apply-config.sh) overrides these values.
   ================================================================ */
const DEFAULTS = {
  latitude: 40.7128,              // example: New York City -- set yours in /etc/default/athan
  longitude: -74.0060,
  method: 2,                      // 2 = ISNA. Full list: aladhan.com/prayer-times-api
  school: 0,                      // 0 = standard Asr, 1 = Hanafi Asr
  tune: "",                       // optional minute offsets, see Aladhan docs

  backgrounds: ["bg/1.jpg","bg/2.jpg","bg/3.jpg","bg/4.jpg","bg/5.jpg","bg/6.jpg",
                "bg/7.jpg","bg/8.jpg","bg/9.jpg","bg/10.jpg"],  // missing files are skipped
  bgSeconds: 600,                 // switch background every 10 min
  kenBurns: true,                 // slow zoom on background

  translationSeconds: 12,         // each translation shows this long; the Ayah/Hadith slide stays
                                  // up long enough to show every language once (3 x 12 s = 36 s)
  langs: ["en"],                  // set TRANSLATION_LANGS in /etc/default/athan; fewer languages = bigger text

const CONFIG = Object.assign({}, DEFAULTS, window.ATHAN_CONFIG || {});
/* ================================================================ */

const PRAYERS = [
  { key: "Fajr",    ar: "الفجر" },
  { key: "Sunrise", ar: "الشروق", info: true },
  { key: "Dhuhr",   ar: "الظهر" },
  { key: "Asr",     ar: "العصر" },
  { key: "Maghrib", ar: "المغرب" },
  { key: "Isha",    ar: "العشاء" }
];
const L3 = { ar: "ara", en: "eng", ur: "urd", bn: "ben" };

const FALLBACK = {
  ayah:   { ar: "فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا", tr: { en: "For indeed, with hardship [will be] ease." },
            ref: "Surah Ash-Sharh (The Relief) · 94:5", refAr: "سورة الشرح" },
  hadith: { ar: "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى",
            tr: { en: "Actions are only by intentions, and every person will have only what he intended." },
            ref: "Sahih al-Bukhari 1", refAr: "" }

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const toArDigits = s => String(s).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
async function getJSON(url, ms = 15000){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const cleanText = s => (s || "").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
const toMin = hhmm => { const [h,m] = hhmm.split(":").map(Number); return h*60 + m; };
function fmt12(hhmm){ let [h,m] = hhmm.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return { t: `${h}:${pad(m)}`, ap }; }
function setStatus(msg){ $("status").textContent = msg || ""; }

/* ---------- prayer times ---------- */
let T = null;              // { key, timings, hijri, hijriAr }
let timingsRetry = null;

async function loadTimings(){
  const d = new Date();
  const key = `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`;
  const cached = store.get("timings");
  if (cached && cached.key === key) applyTimings(cached);
  try {
    const url = `https://api.aladhan.com/v1/timings/${key}?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}`
              + `&method=${CONFIG.method}&school=${CONFIG.school}` + (CONFIG.tune ? `&tune=${CONFIG.tune}` : "");
    const j = await getJSON(url);
    const t = j.data.timings, h = j.data.date.hijri, meta = j.data.meta;
    const timings = {};
    PRAYERS.forEach(p => timings[p.key] = String(t[p.key]).split(" ")[0]);
    const rec = {
      key, timings,
      hijri:   `${h.day} ${h.month.en} ${h.year} AH`,
      hijriAr: `${toArDigits(Number(h.day))} ${h.month.ar} ${toArDigits(h.year)} هـ`,
      method:  meta && meta.method ? meta.method.name : ""
    };
    store.set("timings", rec);
    applyTimings(rec);
    setStatus("");
  } catch(e) {
    if (!(cached && cached.key === key)) setStatus("Prayer times unavailable — retrying…");
    clearTimeout(timingsRetry);
    timingsRetry = setTimeout(loadTimings, 60000);
  }
}

function applyTimings(rec){
  T = rec;
  $("hijri").textContent = rec.hijri;
  $("hijriAr").textContent = rec.hijriAr;
  $("methodInfo").textContent = `${rec.method || "Calculation method " + CONFIG.method} · Asr: ${CONFIG.school ? "Hanafi" : "Standard"}`;
  const friday = new Date().getDay() === 5;
  $("plist").innerHTML = PRAYERS.map(p => {
    const name = (p.key === "Dhuhr" && friday) ? "Jumu'ah" : p.key;
    const ar   = (p.key === "Dhuhr" && friday) ? "الجمعة" : p.ar;
    const f = fmt12(rec.timings[p.key]);
    return `<div class="prow${p.info ? " sunrise" : ""}" id="row-${p.key}">
              <div class="pname">${name}<span class="ar" lang="ar">${ar}</span></div>
              <div class="ptime">${f.t}<small>${f.ap}</small></div>
            </div>`;
  }).join("");
}

/* ---------- clock + next prayer ---------- */
let lastDay = new Date().toDateString();
let lastHour = new Date().getHours();

function tick(){
  const now = new Date();
  let h = now.getHours() % 12 || 12;
  $("clock").innerHTML = `${h}:${pad(now.getMinutes())}<span class="sec">${pad(now.getSeconds())}</span><span class="ampm">${now.getHours() >= 12 ? "PM" : "AM"}</span>`;
  $("greg").textContent = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });

  if (now.toDateString() !== lastDay) { lastDay = now.toDateString(); loadTimings(); }
  if (now.getHours() !== lastHour)    { lastHour = now.getHours(); refreshContent(); }
  if (now.getHours() === 3 && now.getMinutes() === 0 && performance.now() > 120000) location.reload(); // daily fresh start

  if ($("slideNewsVideo").classList.contains("on") && inAdhanWindow()) { slideIdx--; nextSlide(); }  // adhan time: leave the video
  if (!T) return;
  const nowMin = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  const real = PRAYERS.filter(p => !p.info);

  // active = most recent prayer whose time has passed (Isha carries over past midnight)
  let active = null;
  real.forEach(p => { if (toMin(T.timings[p.key]) <= nowMin) active = p.key; });
  if (!active) active = "Isha";
  const sunrise = toMin(T.timings.Sunrise), dhuhr = toMin(T.timings.Dhuhr);
  if (nowMin >= sunrise && nowMin < dhuhr) active = null; // Fajr window ended at sunrise

  PRAYERS.forEach(p => { const r = $("row-" + p.key); if (r) r.classList.toggle("active", p.key === active); });

  let next = real.find(p => toMin(T.timings[p.key]) > nowMin);
  let diff;
  if (next) diff = toMin(T.timings[next.key]) - nowMin;
  else { next = real[0]; diff = (1440 - nowMin) + toMin(T.timings.Fajr); }

  const friday = now.getDay() === 5;
  const nName = (next.key === "Dhuhr" && friday) ? "Jumu'ah" : next.key;
  const nAr   = (next.key === "Dhuhr" && friday) ? "الجمعة" : next.ar;
  const f = fmt12(T.timings[next.key]);
  $("nextName").innerHTML = `${nName}<span class="ar" lang="ar">${nAr}</span><span style="font-weight:500;color:var(--muted);font-size:.7em">${f.t} ${f.ap}</span>`;
  const secs = Math.max(0, Math.round(diff * 60));
  $("nextCd").textContent = `${Math.floor(secs/3600)}:${pad(Math.floor(secs%3600/60))}:${pad(secs%60)}`;
  $("next").classList.toggle("soon", secs <= 600);
}

/* ---------- backgrounds ---------- */
async function initBackgrounds(){
  const ok = new Set();
  await Promise.all(CONFIG.backgrounds.map(src => new Promise(res => {
    const i = new Image(); i.onload = () => { ok.add(src); res(); }; i.onerror = res; i.src = src;
  })));
  const list = CONFIG.backgrounds.filter(s => ok.has(s));
  if (!list.length) return;                       // keep gradient fallback
  const layers = [$("bgA"), $("bgB")];
  if (!CONFIG.kenBurns) layers.forEach(l => l.classList.remove("kb"));
  let idx = Math.floor(Math.random() * list.length), cur = 0;
  const show = () => {
    layers[cur].style.backgroundImage = `url("${list[idx]}")`;
    layers[cur].classList.add("show");
    layers[1-cur].classList.remove("show");
    cur = 1 - cur; idx = (idx + 1) % list.length;
  };
  show();
  if (list.length > 1) setInterval(show, CONFIG.bgSeconds * 1000);
}

/* ---------- Quran ---------- */
async function fetchAyah(){
  for (let attempt = 0; attempt < 8; attempt++){
    const n = 1 + Math.floor(Math.random() * 6236);
    const base = `https://api.alquran.cloud/v1/ayah/${n}/`;
    let en;
    try { en = (await getJSON(base + CONFIG.quranEditions.en)).data; } catch(e){ continue; }
    if (!en || !en.text || en.text.length > 280) continue;      // keep it readable on screen
    const others = await Promise.allSettled(["ar","ur","bn"].map(l => getJSON(base + CONFIG.quranEditions[l])));
    const [ar, ur, bn] = others.map(r => r.status === "fulfilled" && r.value.data ? cleanText(r.value.data.text) : "");
    if (!ar || ar.length > 330) continue;
    const s = en.surah;
    return { ar, tr: { en: cleanText(en.text), ur, bn },
             ref: `Surah ${s.englishName} (${s.englishNameTranslation}) · ${s.number}:${en.numberInSurah}`,
             refAr: `${s.name} ${toArDigits(en.numberInSurah)}` };
  }
  throw new Error("no ayah");
}

/* ---------- Hadith (Bukhari / Muslim: available in AR, EN, UR, BN) ---------- */
const hURL = (lang, book, n) => `https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/${L3[lang]}-${book}/${n}.min.json`;
function hText(j){
  const arr = j.hadiths || j.hadith || [];
  const h = Array.isArray(arr) ? arr[0] : arr;
  return h && h.text ? cleanText(h.text) : "";
}
async function fetchHadith(){
  for (let attempt = 0; attempt < 12; attempt++){
    const b = CONFIG.hadithBooks[Math.floor(Math.random() * CONFIG.hadithBooks.length)];
    const n = 1 + Math.floor(Math.random() * b.max);
    let en;
    try { en = hText(await getJSON(hURL("en", b.key, n))); } catch(e){ continue; }
    if (en.length < 60 || en.length > 420) continue;             // skip fragments and very long narrations
    const others = await Promise.allSettled(["ar","ur","bn"].map(l => getJSON(hURL(l, b.key, n))));
    const [ar, ur, bn] = others.map(r => r.status === "fulfilled" ? hText(r.value) : "");
    if (!ar || ar.length > 650) continue;
    return { ar, tr: { en, ur, bn }, ref: `${b.name} · Hadith ${n}`, refAr: "" };
  }
  throw new Error("no hadith");
}

/* ---------- rendering + auto-fit ---------- */
// Start at textScaleMax and step DOWN until the text fits. Starting above 1 is what lets a
// short ayah fill the card instead of being pinned at the base size; a long hadith still
// shrinks past 1 exactly as before, so nothing can overflow.
function maxScale(){ return Math.max(1, Number(CONFIG.textScaleMax) || 1); }
const ARABIC_MIN = 0.80;            // the Arabic never shrinks below this share: keeps it at or above the translation
// Two knobs: --fs scales the whole card, --afs scales the Arabic only. A long passage spends
// --afs first, so the Arabic gives up room before the translation does; only once the Arabic
// has hit ARABIC_MIN does the whole card step down. Short passages grow to textScaleMax.
function fitScale(card){
  const body = card.querySelector(".card-body"), inner = card.querySelector(".inner");
  let s = maxScale(), a = 1;
  const set = () => { card.style.setProperty("--fs", s); card.style.setProperty("--afs", a); };
  set();
  while (inner.offsetHeight > body.clientHeight && s > 0.4){
    if (a > ARABIC_MIN) a = Math.round((a - 0.04) * 100) / 100;
    else s -= 0.04;
    set();
  }
  return { s, a };
}
function setTrans(card, lang){
  const el = card.querySelector(".trans");
  el.className = "trans " + lang;
  el.lang = lang;
  el.textContent = card._item.tr[lang];
  card.querySelectorAll(".langs span").forEach(sp => sp.classList.toggle("on", sp.dataset.l === lang));
}
function renderCard(id, item){
  const card = $(id);
  card._item = item;
  card._langs = CONFIG.langs.filter(l => item.tr && item.tr[l]);
  card._li = 0;
  card.querySelector(".arabic").textContent = item.ar;
  card.querySelector(".ref").innerHTML = item.ref + (item.refAr ? ` &nbsp;·&nbsp; <span class="ar" lang="ar">${item.refAr}</span>` : "");
  card.querySelector(".langs").innerHTML = card._langs.length > 1
    ? card._langs.map(l => `<span data-l="${l}">${CONFIG.langLabels[l]}</span>`).join("") : "";
  fitCard(card);
}
// Size the text so the LONGEST translation fits, so the Arabic doesn't jump size on rotation.
// Re-run whenever fonts finish loading or the slide comes on screen: a late-loading font
// changes text height, and a stale measurement would clip the first or last line.
function fitCard(card){
  if (!card._item) return;
  const keep = card._li || 0;
  let s = maxScale(), a = 1;
  const take = r => { s = Math.min(s, r.s); a = Math.min(a, r.a); };
  if (!card._langs.length) { card.querySelector(".trans").textContent = ""; take(fitScale(card)); }
  card._langs.forEach(l => { setTrans(card, l); take(fitScale(card)); });
  card.style.setProperty("--fs", s);
  card.style.setProperty("--afs", a);
  if (card._langs.length) setTrans(card, card._langs[keep % card._langs.length]);
}
function showLang(card, idx){
  if (!card._langs || !card._langs.length) return;
  card._li = idx % card._langs.length;
  setTrans(card, card._langs[card._li]);
  const body = card.querySelector(".card-body"), inner = card.querySelector(".inner");
  if (inner.offsetHeight > body.clientHeight) fitCard(card);           // a font loaded late: shrink to fit
}
function rotateTranslations(){
  ["ayahCard","hadithCard"].forEach(id => {
    const card = $(id);
    if (!card.closest(".slide").classList.contains("on")) return;     // only the card on screen
    if (!card._langs || card._langs.length < 2) return;
    if (card._li >= card._langs.length - 1) return;                       // last language stays until the slide changes
    const el = card.querySelector(".trans");
    el.classList.add("fade");
    setTimeout(() => { showLang(card, card._li + 1); el.classList.remove("fade"); }, 800);
  });
}

let contentRetry = null;
async function refreshContent(){
  const d = new Date();
  const hourKey = `${d.toDateString()} ${d.getHours()}`;
  const cache = store.get("content");
  if (cache && cache.hour === hourKey) { renderCard("ayahCard", cache.ayah); renderCard("hadithCard", cache.hadith); return; }

  let ayah = null, hadith = null;
  try { ayah = await fetchAyah(); } catch(e){}
  try { hadith = await fetchHadith(); } catch(e){}

  const show = {
    ayah:   ayah   || (cache && cache.ayah)   || FALLBACK.ayah,
    hadith: hadith || (cache && cache.hadith) || FALLBACK.hadith
  };
  renderCard("ayahCard", show.ayah);
  renderCard("hadithCard", show.hadith);

  if (ayah && hadith) store.set("content", { hour: hourKey, ...show });
  else { clearTimeout(contentRetry); contentRetry = setTimeout(refreshContent, 5 * 60000); }  // retry in 5 min
}

/* ---------- news tickers (Bengali + US local) ---------- */
const escHTML = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tickerSig = {};
function renderTicker(tickerId, trackId, items){
  items = (items || []).filter(i => i && i.title);
  const sig = JSON.stringify(items);
  if (tickerSig[tickerId] === sig) return;       // unchanged: don't restart the scroll mid-headline
  tickerSig[tickerId] = sig;
  const ticker = $(tickerId), track = $(trackId);
  if (!items.length) { ticker.classList.add("hidden"); return; }
  const one = items.map(i => `<span class="nitem">${escHTML(i.title)}<span class="nsrc">${escHTML(i.source || "")}</span></span>`)
                   .join('<span class="nsep">◆</span>') + '<span class="nsep">◆</span>';
  track.innerHTML = one + one;                   // two copies -> seamless loop at -50%
  ticker.classList.remove("hidden");
  requestAnimationFrame(() => {
    const half = track.scrollWidth / 2;
    const pxPerSec = window.innerWidth * CONFIG.newsSpeed;
    track.style.animation = "none"; void track.offsetWidth;            // restart animation
    track.style.animation = `tscroll ${Math.max(20, half / pxPerSec)}s linear infinite`;
  });
}
async function loadNews(){
  try {
    const r = await fetch("news.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (CONFIG.usNews) renderTicker("tickerUS", "ttrackUS", j.us);
    if (CONFIG.news)   renderTicker("tickerBN", "ttrackBN", j.bn || j.items);
  } catch(e) { /* no news.json yet or offline: keep whatever is showing */ }
}

/* ---------- weather + alerts ---------- */
let alerts = [], alertIdx = 0;
async function loadWeather(){
  try {
    const r = await fetch("weather.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const w = await r.json();
    const stale = (Date.now()/1000 - (w.updated || 0)) > 3 * 3600;     // older than 3 h: don't trust it
    const c = w.current || {}, t = w.today || {};
    if (!stale && c.temp !== undefined) {
      $("wIcon").textContent = c.icon || "";
      $("wTemp").innerHTML = `${c.temp}°<small>F</small>`;
      $("wDetail").innerHTML =
        `<div class="wtext">${escHTML(c.text || "")}</div>` +
        `<div>Feels <b>${c.feels}°</b> · H <b>${t.high}°</b> L <b>${t.low}°</b></div>` +
        `<div>Rain <b>${t.rain_chance ?? 0}%</b> · Wind <b>${c.wind} mph</b> · Hum <b>${c.humidity}%</b></div>`;
      $("weather").classList.remove("hidden");
    } else {
      $("weather").classList.add("hidden");
    }
    renderForecast(stale ? [] : (w.days || []), w.updated);
    alerts = stale ? [] : (w.alerts || []);
    alertIdx = 0; showAlert();
  } catch(e) { /* keep last shown */ }
}
let fcDays = [];
function renderForecast(days, updated){
  fcDays = days.filter(d => d && d.date).slice(0, 7);
  if (!fcDays.length) { $("fc").innerHTML = ""; return; }
  const highs = fcDays.map(d => d.high).filter(v => v !== null && v !== undefined);
  const lows  = fcDays.map(d => d.low).filter(v => v !== null && v !== undefined);
  const lo = Math.min(...lows), hi = Math.max(...highs), span = Math.max(1, hi - lo);
  const dash = v => (v === null || v === undefined) ? "—" : `${v}°`;
  $("fc").innerHTML = fcDays.map((d, i) => {
    const hasT = d.high !== null && d.high !== undefined && d.low !== null && d.low !== undefined;
    const bar = hasT ? `<i style="left:${(d.low - lo) / span * 100}%;right:${(hi - d.high) / span * 100}%"></i>` : "";
    const wet = (d.rain || 0) >= 50;
    const rainTxt = d.precip >= 0.01 ? `💧 ${d.rain}%<br>${d.precip}"` : `💧 ${d.rain || 0}%`;
    return `<div class="fday${i === 0 ? " today" : ""}${wet ? " wet" : ""}" title="${escHTML(d.text || "")}">
              <div class="fdow">${escHTML(d.dow)}</div>
              <div class="fmd">${escHTML(d.md)}</div>
              <div class="ficon">${d.icon || ""}</div>
              <div class="ftext">${escHTML(d.text || "")}</div>
              <div class="ftemp">${dash(d.high)}<small>${dash(d.low)}</small></div>
              <div class="fbar">${bar}</div>
              <div class="frain">${rainTxt}</div>
              <div class="fwind">💨 ${d.wind ?? "—"} mph</div>
            </div>`;
  }).join("");
  const u = new Date((updated || 0) * 1000);
  $("fcUpd").textContent = `High / low °F · rain chance · Open-Meteo · ${u.getHours() % 12 || 12}:${pad(u.getMinutes())} ${u.getHours() >= 12 ? "PM" : "AM"}`;
}
function showAlert(){
  const bar = $("alertbar");
  if (!alerts.length) { bar.classList.add("hidden"); return; }
  const a = alerts[alertIdx % alerts.length];
  bar.classList.remove("hidden", "moderate", "severe");
  if (a.level === "moderate" || a.level === "severe") bar.classList.add(a.level);
  $("aIcon").textContent = a.icon || "⚠️";
  $("aText").textContent = a.text;
  $("aCount").textContent = alerts.length > 1 ? `${(alertIdx % alerts.length) + 1}/${alerts.length}` : "";
}
function rotateAlerts(){
  if (alerts.length < 2) return;
  $("aText").style.opacity = 0;
  setTimeout(() => { alertIdx++; showAlert(); $("aText").style.opacity = 1; }, 600);
}

/* ---------- family calendar + lists (slides 2 and 3) ---------- */
let fam = null;
async function loadFamily(){
  try {
    const r = await fetch("family.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (Date.now()/1000 - (j.updated || 0) > 24 * 3600) { fam = null; return; }   // a day old: stop showing it
    fam = j;
    const upd = new Date(j.updated * 1000);
    const updTxt = `Updated ${upd.getHours() % 12 || 12}:${pad(upd.getMinutes())} ${upd.getHours() >= 12 ? "PM" : "AM"}`;
    $("weekUpd").textContent = updTxt; $("listsUpd").textContent = updTxt;

    $("week").innerHTML = (j.days || []).map(d => {
      const evs = d.events.map(e => e.time
        ? `<span class="ev"><span class="t">${e.time}</span>${escHTML(e.title)}</span>`
        : `<span class="ev allday">${escHTML(e.title)}</span>`).join("");
      const more = d.total > d.events.length ? `<span class="more">+${d.total - d.events.length} more</span>` : "";
      return `<div class="wday${d.today ? " today" : ""}">
                <div class="wlabel">${escHTML(d.label)}<small>${escHTML(d.sub)}</small></div>
                <div class="wevs">${evs || '<span class="none">—</span>'}${more}</div>
              </div>`;
    }).join("");

    $("lists").innerHTML = (j.lists || []).map(l => {
      const items = l.items.map(i => `<div class="li${i.high ? " high" : ""}"><span class="box"></span>${escHTML(i.title)}` +
        (i.due ? `<span class="due${i.due === "Overdue" ? " over" : ""}">${escHTML(i.due)}</span>` : "") + `</div>`).join("");
      const more = l.total > l.items.length ? `<div class="more">+${l.total - l.items.length} more</div>` : "";
      return `<div class="lcol"><div class="lname">${escHTML(l.name)}<span class="n">${l.total} item${l.total === 1 ? "" : "s"}</span></div>
              <div class="litems">${items || '<div class="alldone">All done ✓</div>'}${more}</div></div>`;
    }).join("");
  } catch(e) { /* keep last shown */ }
}

/* ---------- markets slide ---------- */
let mkt = null;
function fmtNum(v, sym){
  const dec = Math.abs(v) >= 1000 ? 0 : (Math.abs(v) >= 10 ? 2 : 3);
  const n = v.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  return sym === "^TNX" ? n + "%" : n;
}
function spark(vals, prev, up){
  if (!vals || vals.length < 2) return "";
  const all = vals.concat([prev]);
  const lo = Math.min(...all), hi = Math.max(...all), span = (hi - lo) || 1, W = 200, H = 50;
  const x = i => (i / (vals.length - 1) * W).toFixed(1), y = v => (H - 3 - (v - lo) / span * (H - 6)).toFixed(1);
  const pts = vals.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  const col = up ? "#3ecf8e" : "#f16a6a";
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" x2="${W}" y1="${y(prev)}" y2="${y(prev)}" stroke="rgba(255,255,255,.25)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
async function loadMarkets(){
  try {
    const r = await fetch("markets.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (Date.now()/1000 - (j.updated || 0) > 2 * 24 * 3600) { mkt = null; return; }   // two days old: hide
    mkt = j;
    $("mk").innerHTML = (j.quotes || []).slice(0, 8).map(q => {
      const up = q.change >= 0, arrow = up ? "▲" : "▼";
      const chg = q.symbol === "^TNX" ? Math.abs(q.change).toFixed(3) : fmtNum(Math.abs(q.change), "");
      return `<div class="mt ${up ? "up" : "down"}">
                <div class="mlabel">${escHTML(q.label)}</div>
                <div class="mprice">${fmtNum(q.price, q.symbol)}</div>
                <div class="mchg">${arrow} ${chg} (${up ? "+" : "−"}${Math.abs(q.pct).toFixed(2)}%)</div>
                ${spark(q.spark, q.prev, up)}
                ${q.stale ? '<div class="mstale">not updated</div>' : ""}
              </div>`;
    }).join("");
    // Lay the tiles out in a full rectangle instead of leaving holes in a fixed 4-wide
    // grid: 8 -> 4x2, 6 -> 3x2, 4 -> 2x2. Fewer, larger tiles read better on the TV.
    const n = Math.min((j.quotes || []).length, 8);
    $("mk").style.setProperty("--mkcols", n <= 4 ? Math.max(1, n) : Math.ceil(n / 2));
    const u = new Date(j.updated * 1000);
    $("mkUpd").textContent = `Delayed quotes · ${u.getHours() % 12 || 12}:${pad(u.getMinutes())} ${u.getHours() >= 12 ? "PM" : "AM"}`;
    const st = $("mkState");
    st.textContent = j.us_open ? "US MARKET OPEN" : "US MARKET CLOSED";
    st.className = "mstate " + (j.us_open ? "open" : "closed");
  } catch(e) { /* keep last shown */ }
}

/* ---------- live news video slide ----------
   The player is created when the slide comes on and destroyed when it leaves, so the
   video only uses CPU and bandwidth while it is actually on screen. If a channel is not
   live or refuses embedding, the next channel is tried; if none works, the slide is
   skipped until the next 30-minute retry. */
let ytReady = null, ytPlayer = null, vChan = 0, vWatchdog = null, vSkip = false;
function loadYT(){
  if (ytReady) return ytReady;
  ytReady = new Promise(res => {
    window.onYouTubeIframeAPIReady = () => res(true);
    const sc = document.createElement("script");
    sc.src = "https://www.youtube.com/iframe_api";
    sc.onerror = () => { ytReady = null; res(false); };
    document.head.appendChild(sc);
  });
  return ytReady;
}
function stopNewsVideo(){
  clearTimeout(vWatchdog);
  try { if (ytPlayer) ytPlayer.destroy(); } catch(e) {}
  ytPlayer = null;
  $("vbox").innerHTML = '<div class="vmsg" id="vmsg">Connecting to live news…</div>';
}
async function startNewsVideo(tries = 0){
  stopNewsVideo();
  let played = false;                                                   // did THIS attempt ever actually play?
  const chans = CONFIG.newsChannels || [];
  const fail = () => {                                                  // nothing plays: move on instead of showing a dead slide
    vSkip = true;
    if ($("slideNewsVideo").classList.contains("on")) { slideIdx--; nextSlide(); }
  };
  if (!chans.length || tries >= chans.length) return fail();
  const ch = chans[vChan % chans.length];
  $("vName").textContent = "· " + ch.name;
  if (!(await loadYT()) || !window.YT || !YT.Player) return fail();
  if (!$("slideNewsVideo").classList.contains("on")) return;          // slide already moved on
  const host = document.createElement("div"); host.id = "ytHost";
  $("vbox").appendChild(host);
  // A segment now runs for many minutes, so a stream that drops halfway through must be
  // replaced rather than leaving a dead slide up. If this attempt had been playing, the
  // channel list is healthy and the retry count starts over instead of giving up.
  const next = () => {
    if (!$("slideNewsVideo").classList.contains("on")) return;          // slide already moved on
    vChan++; startNewsVideo(played ? 0 : tries + 1);
  };
  ytPlayer = new YT.Player("ytHost", {
    width: "100%", height: "100%",
    playerVars: {
      autoplay: 1, mute: CONFIG.newsMuted ? 1 : 0, controls: 0, rel: 0, playsinline: 1,
      cc_load_policy: 1, iv_load_policy: 3, disablekb: 1, origin: location.origin,
      channel: ch.id
    },
    videoId: "live_stream",
    events: {
      onReady: e => {
        if (CONFIG.newsMuted) e.target.mute(); else { e.target.unMute(); e.target.setVolume(CONFIG.newsVolume); }
        e.target.playVideo();
      },
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) {
          clearTimeout(vWatchdog); vSkip = false; played = true;
          const m = $("vmsg"); if (m) m.remove();
        } else if (e.data === YT.PlayerState.ENDED) {
          clearTimeout(vWatchdog); next();                              // live stream ended mid-segment
        } else if (e.data === YT.PlayerState.BUFFERING) {
          clearTimeout(vWatchdog); vWatchdog = setTimeout(next, 25000); // stuck buffering: move on
        }
      },
      onError: next
    }
  });
  vWatchdog = setTimeout(next, 25000);                                  // not playing after 25 s: try the next channel
}

/* ---------- self-update ----------
   Re-checks index.html and config.js every 3 minutes, bypassing every cache. When either
   has changed on the server (a new install or apply-config.sh), the page reloads itself,
   so a deploy reaches the TV without restarting the kiosk. */
let pageSig = null;
async function checkForUpdate(){
  try {
    const sig = (await Promise.all(["index.html", "config.js"].map(async f => {
      const r = await fetch(f + "?v=" + Date.now(), { method: "HEAD", cache: "no-store" });
      return r.ok ? (r.headers.get("etag") || r.headers.get("last-modified") || "") : "";
    }))).join("|");
    if (!sig.replace("|", "")) return;
    if (pageSig === null) pageSig = sig;
    else if (sig !== pageSig) location.reload();
  } catch(e) { /* offline: try again later */ }
}

/* The adhan (played by the box, not the page) must never compete with the news audio:
   the video slide is left out from 1 minute before each prayer to 6 minutes after. */
function inAdhanWindow(){
  if (!T) return false;
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60;
  return PRAYERS.some(p => !p.info && T.timings[p.key] &&
    m >= toMin(T.timings[p.key]) - 1 && m < toMin(T.timings[p.key]) + 6);
}

const SLIDES = [
  ["ayah", "slideAyah"], ["hadith", "slideHadith"], ["forecast", "slideForecast"],
  ["newsvideo", "slideNewsVideo"], ["markets", "slideMarkets"],
  ["week", "slideWeek"], ["lists", "slideLists"]
];
let slideIdx = 0, langTimer = null, slideTimer = null;
function availableSlides(){
  const s = ["ayah", "hadith"];
  if (CONFIG.weather && CONFIG.forecast && fcDays.length) s.push("forecast");
  if (CONFIG.newsVideo && navigator.onLine && !vSkip && !inAdhanWindow()) s.push("newsvideo");
  if (CONFIG.markets && mkt && (mkt.quotes || []).length) s.push("markets");
  if (CONFIG.family && fam) {
    if ((fam.days || []).some(d => d.total > 0)) s.push("week");
    if ((fam.lists || []).length) s.push("lists");
  }
  return s;
}
function slideDuration(key){
  if (key === "ayah" || key === "hadith") {
    const card = $(key === "ayah" ? "ayahCard" : "hadithCard");
    const n = (card._langs && card._langs.length) || 1;
    return Math.max(CONFIG.slideSeconds[key] || 15, n * CONFIG.translationSeconds);  // every language shown once
  }
  return CONFIG.slideSeconds[key] || 20;
}
function nextSlide(){
  const avail = availableSlides();
  slideIdx = (slideIdx + 1) % avail.length;
  const cur = avail[slideIdx];
  clearInterval(langTimer);
  if (cur === "ayah" || cur === "hadith") {
    const card = $(cur === "ayah" ? "ayahCard" : "hadithCard");
    card._li = 0; fitCard(card);                                                    // re-measure, start at the first language
    langTimer = setInterval(rotateTranslations, CONFIG.translationSeconds * 1000);  // then one step per language
  }
  SLIDES.forEach(([k, id]) => $(id).classList.toggle("on", k === cur));
  if (cur === "newsvideo") startNewsVideo(); else if (ytPlayer || $("ytHost")) stopNewsVideo();
  $("dots").innerHTML = avail.length > 1 ? avail.map((k, i) => `<i class="${i === slideIdx ? "on" : ""}"></i>`).join("") : "";
  clearTimeout(slideTimer);
  slideTimer = setTimeout(nextSlide, slideDuration(cur) * 1000);
}


/* ---------- start ---------- */
(async function init(){
  initBackgrounds();
  if (CONFIG.news || CONFIG.usNews) { loadNews(); setInterval(loadNews, 5 * 60000); }
  if (CONFIG.family) { loadFamily(); setInterval(loadFamily, 2 * 60000); }
  if (CONFIG.markets) { loadMarkets(); setInterval(loadMarkets, 2 * 60000); }
  if (CONFIG.newsVideo) { loadYT(); setInterval(() => { vSkip = false; }, 30 * 60000); }   // retry a failed video every 30 min
  if (CONFIG.weather) { loadWeather(); setInterval(loadWeather, 5 * 60000); setInterval(rotateAlerts, CONFIG.alertSeconds * 1000); }
  document.querySelector("#tickerUS .tlabel").lastChild.textContent = CONFIG.usNewsLabel;
  if (CONFIG.newsVideoTitle) $("vTitle").textContent = CONFIG.newsVideoTitle;
  loadTimings();
  tick(); setInterval(tick, 1000);
  checkForUpdate(); setInterval(checkForUpdate, 3 * 60000);
  // make sure all four scripts' fonts are loaded before measuring text size
  const fontLoads = ['1em "Amiri Quran"', '1em "Amiri"', '1em "Noto Nastaliq Urdu"', '1em "Noto Sans Bengali"', '1em "Inter"']
    .map(f => document.fonts.load(f, "ابجد اردو বাংলা Aa").catch(() => {}));
  await Promise.race([Promise.all(fontLoads), new Promise(r => setTimeout(r, 8000))]);
  await Promise.race([refreshContent(), new Promise(r => setTimeout(r, 20000))]);   // never hold the slideshow > 20 s
  slideIdx = -1; nextSlide();
  document.fonts.addEventListener("loadingdone", () => { fitCard($("ayahCard")); fitCard($("hadithCard")); });
})();
</script>
